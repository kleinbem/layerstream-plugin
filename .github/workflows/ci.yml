name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: 7d9b931df9bb7c689f067a7fed23e7f5253951f6
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build pkg-config protobuf-compiler libvulkan-dev glslc spirv-headers mesa-vulkan-drivers
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Verify workspace, plugin, and SDK manifest versions match
        run: |
          cargo_ver=$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)
          plugin_ver=$(awk -F'"' '/^version =/{print $2; exit}' plugin.toml)
          py_cargo_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/python/Cargo.toml)
          py_proj_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/python/pyproject.toml)
          py_cuda_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/python-cuda13/pyproject.toml)
          node_cargo_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/node/Cargo.toml)
          node_pkg_ver=$(python3 -c 'import json; print(json.load(open("bindings/node/package.json"))["version"])')
          echo "Cargo=${cargo_ver} plugin=${plugin_ver} py_cargo=${py_cargo_ver} py_proj=${py_proj_ver} py_cuda=${py_cuda_ver} node_cargo=${node_cargo_ver} node_pkg=${node_pkg_ver}"
          test "$cargo_ver" = "$plugin_ver"
          test "$cargo_ver" = "$py_cargo_ver"
          test "$cargo_ver" = "$py_proj_ver"
          test "$cargo_ver" = "$py_cuda_ver"
          test "$cargo_ver" = "$node_cargo_ver"
          test "$cargo_ver" = "$node_pkg_ver"

      - name: Enforce max 2,000 LoC per source file
        run: |
          bad=$(git ls-files '*.rs' '*.cpp' '*.hpp' '*.py' '*.js' '*.ts' | xargs wc -l | awk '$1 > 2000 && $2 != "total"')
          if [ -n "$bad" ]; then
            echo "::error::Source files exceeding 2,000 LoC limit:"
            echo "$bad"
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Workspace unit, protocol, and lifecycle tests
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: cargo test --locked --workspace -- --test-threads 1

      - name: Build Vulkan dynamic-backends release archive and smoke-test binary
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          cargo build --locked --release -p layerstream-plugin --features vulkan,dynamic-backends
          stage="layerstream-x86_64-unknown-linux-gnu"
          root="${stage}/layerstream"
          mkdir -p "$root"
          cp target/release/layerstream-plugin "$root/layerstream"
          for lib in target/release/libggml*.so* target/release/libllama*.so*; do
            [ -e "$lib" ] && cp "$lib" "$root/"
          done
          cp plugin.toml README.md LICENSE "$root/"
          cp -r licenses "$root/licenses"
          tar czf "${stage}.tar.gz" -C "$stage" layerstream
          mkdir -p smoke-extract
          tar xzf "${stage}.tar.gz" -C smoke-extract
          ./smoke-extract/layerstream/layerstream --help

  asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: 7d9b931df9bb7c689f067a7fed23e7f5253951f6
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build pkg-config protobuf-compiler
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run stream_engine.cpp parity tests under ASan + UBSan
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: g++-14
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-Wl,--no-as-needed -C link-arg=-lasan -C link-arg=-lubsan"
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          ASAN_SO="$(g++-14 -print-file-name=libasan.so)"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="env LD_PRELOAD=${ASAN_SO}" \
            cargo test --locked --target x86_64-unknown-linux-gnu -p layerstream-core --test parity_test -- --test-threads 1

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: 7d9b931df9bb7c689f067a7fed23e7f5253951f6
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build pkg-config protobuf-compiler
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Run stream_engine.cpp parity tests under TSan
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
          CFLAGS: "-fsanitize=thread -fno-omit-frame-pointer"
          CXXFLAGS: "-fsanitize=thread -fno-omit-frame-pointer"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: g++-14
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-Wl,--no-as-needed -C link-arg=-ltsan"
          TSAN_OPTIONS: "halt_on_error=1:second_deadlock_stack=1:suppressions=/tmp/tsan.supp"
        run: |
          cat > /tmp/tsan.supp <<'EOF'
          # Rust's prebuilt stdlib (libtest mpmc channel) is not compiled with
          # -Zsanitizer=thread, so TSan sees its memcpy without its atomics.
          # Match source paths because Rust v0 symbol names are mangled.
          race:library/std/src/sync/mpmc
          race:library/core/src/profiling.rs
          EOF
          TSAN_SO="$(g++-14 -print-file-name=libtsan.so)"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="setarch x86_64 -R env LD_PRELOAD=${TSAN_SO}" \
            cargo test --locked --target x86_64-unknown-linux-gnu -p layerstream-core --test parity_test -- --test-threads 1

  nix-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3.24.3

      - name: Check flake formatting and evaluate devShells
        run: |
          nix fmt -- --ci
          for attr in \
            devShells.x86_64-linux.default.drvPath \
            devShells.x86_64-linux.python.drvPath \
            devShells.x86_64-linux.node.drvPath \
            devShells.x86_64-linux.cuda.drvPath \
            devShells.aarch64-linux.default.drvPath \
            devShells.aarch64-linux.cuda.drvPath \
            devShells.aarch64-darwin.default.drvPath; do
            nix eval ".#${attr}" --raw
            echo ""
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit root Cargo.lock (RUSTSEC)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit bindings/python/Cargo.lock (RUSTSEC)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lockfile-path: bindings/python/Cargo.lock

      - name: Audit bindings/node/Cargo.lock (RUSTSEC)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lockfile-path: bindings/node/Cargo.lock

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov

      - name: Pure-Rust crate coverage (json-schema-gbnf, gguf-direct-io, hf-gguf)
        run: |
          {
            echo "### Rust Crate Coverage"
            echo '```'
            cargo llvm-cov --locked -p json-schema-gbnf -p gguf-direct-io -p hf-gguf --summary-only -- --test-threads 1 | tee /dev/stderr
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
