name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ggml-org/llama.cpp
          ref: 0693dbfb915f33233818373b5f6969396658d02c
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config protobuf-compiler libvulkan-dev glslc spirv-headers mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Verify workspace, plugin, and SDK manifest versions match
        run: |
          cargo_ver=$(awk -F'"' '/^version =/{print $2; exit}' Cargo.toml)
          plugin_ver=$(awk -F'"' '/^version =/{print $2; exit}' plugin.toml)
          py_cargo_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/python/Cargo.toml)
          py_proj_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/python/pyproject.toml)
          py_cuda_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/python-cuda12/pyproject.toml)
          node_cargo_ver=$(awk -F'"' '/^version =/{print $2; exit}' bindings/node/Cargo.toml)
          node_pkg_ver=$(python3 -c 'import json; print(json.load(open("bindings/node/package.json"))["version"])')
          echo "Cargo=${cargo_ver} plugin=${plugin_ver} py_cargo=${py_cargo_ver} py_proj=${py_proj_ver} py_cuda=${py_cuda_ver} node_cargo=${node_cargo_ver} node_pkg=${node_pkg_ver}"
          test "$cargo_ver" = "$plugin_ver"
          test "$cargo_ver" = "$py_cargo_ver"
          test "$cargo_ver" = "$py_proj_ver"
          test "$cargo_ver" = "$py_cuda_ver"
          test "$cargo_ver" = "$node_cargo_ver"
          test "$cargo_ver" = "$node_pkg_ver"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Workspace unit, protocol, and lifecycle tests
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: cargo test --locked --workspace -- --test-threads 1

      - name: Build Vulkan dynamic-backends release archive and smoke-test binary
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          cargo build --locked --release -p layerstream-plugin --features vulkan,dynamic-backends
          stage="layerstream-x86_64-unknown-linux-gnu"
          root="${stage}/layerstream"
          mkdir -p "$root"
          cp target/release/layerstream-plugin "$root/layerstream"
          for lib in target/release/libggml*.so* target/release/libllama*.so*; do
            [ -e "$lib" ] && cp "$lib" "$root/"
          done
          cp plugin.toml README.md LICENSE "$root/"
          cp -r licenses "$root/licenses"
          tar czf "${stage}.tar.gz" -C "$stage" layerstream
          mkdir -p smoke-extract
          tar xzf "${stage}.tar.gz" -C smoke-extract
          ./smoke-extract/layerstream/layerstream --help
