name: Node Bindings

on:
  pull_request:
    paths:
      - "bindings/node/**"
      - "crates/layerstream-core/**"
      - "Cargo.toml"
      - ".github/workflows/node-bindings.yml"
  push:
    branches:
      - main
    paths:
      - "bindings/node/**"
      - "crates/layerstream-core/**"
      - "Cargo.toml"
      - ".github/workflows/node-bindings.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1

      - name: Lint and format check JS/TS (Biome)
        working-directory: bindings/node
        run: biome check .

      - name: TypeScript strict declaration check (tsc)
        working-directory: bindings/node
        run: npx --yes --package typescript@5.9 -- tsc -p tsconfig.json --noEmit

  build-node:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            napi_triple: linux-x64-gnu
            features: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            napi_triple: linux-arm64-gnu
            features: ""
          - os: macos-15
            target: aarch64-apple-darwin
            napi_triple: darwin-arm64
            features: "metal"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: 9c003a97ab34a69cc49243f9b02014038205ffae
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Rust format & clippy check (bindings/node)
        working-directory: bindings/node
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build native Node-API addon
        working-directory: bindings/node
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          extra_args=()
          if [ -n "${{ matrix.features }}" ]; then
            extra_args+=(--features "${{ matrix.features }}")
          fi
          node scripts/build-native.mjs --release --locked --triple "${{ matrix.napi_triple }}" "${extra_args[@]}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            codesign --force --sign - "layerstream.${{ matrix.napi_triple }}.node"
            codesign --verify --strict "layerstream.${{ matrix.napi_triple }}.node"
          fi

      - name: Run Node.js & ESM integration test suite with V8 coverage
        working-directory: bindings/node
        run: |
          npm run test:coverage
          node --input-type=module -e 'import { AutoModel, OpenAI, version } from "./index.js"; if (!version || typeof AutoModel.fromPretrained !== "function" || typeof OpenAI !== "function") process.exit(1);'
          mkdir -p dist
          npm pack --pack-destination dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layerstream-node-${{ matrix.napi_triple }}
          path: |
            bindings/node/layerstream.${{ matrix.napi_triple }}.node
            bindings/node/dist/*.tgz
