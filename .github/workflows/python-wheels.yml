name: Python Wheels

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "crates/layerstream-core/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  push:
    branches:
      - main
    paths:
      - "bindings/python/**"
      - "crates/layerstream-core/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ""
          - os: macos-15
            target: aarch64-apple-darwin
            features: "metal"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ggml-org/llama.cpp
          ref: 0693dbfb915f33233818373b5f6969396658d02c
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config patchelf

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install maturin and pytest
        run: python -m pip install --upgrade pip "maturin>=1.7,<2.0" pytest

      - name: Rust format & clippy check (bindings/python)
        working-directory: bindings/python
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build wheel
        working-directory: bindings/python
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          extra_args=()
          if [ -n "${{ matrix.features }}" ]; then
            extra_args+=(--features "${{ matrix.features }}")
          fi
          maturin build --locked --release --out dist "${extra_args[@]}"

      - name: Install built wheel and run pytest smoke suite
        working-directory: bindings/python
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest -v

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: layerstream-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
