name: Python Wheels

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "bindings/python-cuda13/**"
      - "crates/layerstream-core/**"
      - "crates/layerstream-server/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  push:
    branches:
      - main
    paths:
      - "bindings/python/**"
      - "bindings/python-cuda13/**"
      - "crates/layerstream-core/**"
      - "crates/layerstream-server/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: 6d5f6487219ec7171a5558aa5d75b97c5720dad6
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config binutils

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Rust format & clippy check (bindings/python)
        working-directory: bindings/python
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Python static lint, strict type check, and audit (ruff + pyright + pip-audit)
        working-directory: bindings/python
        run: |
          uv pip install --system ruff pyright pip-audit pytest pytest-asyncio pytest-timeout hypothesis
          ruff check python tests scripts ../python-cuda13/python ../python-cuda13/scripts ../../benchmarks
          ruff format --check python tests scripts ../python-cuda13/python ../python-cuda13/scripts ../../benchmarks
          pyright python/layerstream tests
          pip-audit --strict

      - name: Smoke-test layerstream-cuda13 companion wheel packaging & metadata
        run: |
          uv pip install --system "setuptools>=77" twine
          mkdir -p bindings/python-cuda13/python/layerstream_cuda13/_backends
          gcc -shared -fPIC -Wl,-soname,libggml-cuda.so -Wl,-rpath,'$ORIGIN' \
            -o bindings/python-cuda13/python/layerstream_cuda13/_backends/libggml-cuda.so -xc /dev/null
          python bindings/python-cuda13/scripts/build_wheel.py --skip-cmake --out dist
          python -m twine check --strict bindings/python-cuda13/dist/*.whl
          uv pip install --system --no-deps --reinstall bindings/python-cuda13/dist/*.whl
          python -c 'import os, layerstream_cuda13; assert os.path.isfile(os.path.join(layerstream_cuda13.backend_dir(), "libggml-cuda.so"))'

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Workaround: `--auditwheel skip` preserves unhashed `libggml-*.so` names for runtime
          # `dlopen` plugin loading; `audit_wheel_elf.py` enforces manylinux_2_34 ELF bounds
          # (upstream: pypa/auditwheel#594).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: "2_34"
            manylinux: "2_34"
            vulkan_sdk: "/opt/vk"
            args: "--auditwheel skip --locked --release --out dist --features vulkan,dynamic-backends"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: "2_34"
            manylinux: "2_34"
            vulkan_sdk: "/opt/vk"
            args: "--auditwheel skip --locked --release --out dist --features vulkan,dynamic-backends"
          - os: macos-15
            target: aarch64-apple-darwin
            container: ""
            manylinux: ""
            vulkan_sdk: ""
            args: "--locked --release --out dist --features metal"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            container: ""
            manylinux: ""
            vulkan_sdk: ""
            args: "--locked --release --out dist --features vulkan,dynamic-backends"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: 6d5f6487219ec7171a5558aa5d75b97c5720dad6
          path: third_party/llama.cpp

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile vulkan-sdk.exe
          Start-Process -Wait -FilePath .\vulkan-sdk.exe -ArgumentList "--accept-licenses --default-answer --confirm-command install"
          Remove-Item -Force vulkan-sdk.exe
          $vk = (Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1).FullName
          "VULKAN_SDK=$vk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CARGO_TARGET_DIR=D:\t" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Activate MSVC x64 developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: runner.os != 'Linux'

      - name: Build PyPI-compatible abi3 wheel (Vulkan on Linux/Windows, Metal on macOS)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          LAYERSTREAM_PORTABLE_WHEEL: "1"
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          VULKAN_SDK: ${{ matrix.vulkan_sdk || env.VULKAN_SDK }}
          CMAKE_PREFIX_PATH: ${{ matrix.vulkan_sdk || env.VULKAN_SDK }}
          CMAKE_GENERATOR: ${{ runner.os == 'Windows' && 'Ninja' || '' }}
        with:
          command: build
          working-directory: bindings/python
          container: ${{ matrix.container }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            dnf install -y bzip2
            arch=$(uname -m)
            if [ "$arch" = "aarch64" ]; then mamba_plat="linux-aarch64"; else mamba_plat="linux-64"; fi
            curl -fsSL "https://micro.mamba.pm/api/micromamba/${mamba_plat}/latest" | tar -xj -C /usr/local/bin --strip-components=1 bin/micromamba
            MAMBA_ROOT_PREFIX=/opt/mamba micromamba create -y -p /opt/vk -c conda-forge shaderc libvulkan-headers libvulkan-loader spirv-headers cmake ninja
            ln -sf /opt/vk/bin/glslc /opt/vk/bin/cmake /opt/vk/bin/ninja /usr/local/bin/
          args: ${{ matrix.args }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Verify PyPI wheel ELF symbols, metadata, CLI, and pytest + hypothesis suite
        working-directory: bindings/python
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo chown -R "$(id -u):$(id -g)" dist python/layerstream/_backends || true
            python scripts/audit_wheel_elf.py dist/*.whl
          fi
          uv pip install --system pytest pytest-asyncio pytest-cov pytest-timeout hypothesis twine
          python -m twine check --strict dist/*.whl
          for whl in dist/*.whl; do
            echo "Built wheel: $whl"
            case "$whl" in
              *-linux_*.whl)
                echo "ERROR: un-repaired linux_* wheel tag would be rejected by PyPI: $whl" >&2
                exit 1
                ;;
            esac
          done
          uv pip install --system --reinstall dist/*.whl
          layerstream --version
          python -m pytest -v --cov=layerstream --cov-report=term-missing --cov-fail-under=100

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layerstream-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
