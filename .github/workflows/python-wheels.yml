name: Python Wheels

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "crates/layerstream-core/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  push:
    branches:
      - main
    paths:
      - "bindings/python/**"
      - "crates/layerstream-core/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ggml-org/llama.cpp
          ref: 0693dbfb915f33233818373b5f6969396658d02c
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Rust format & clippy check (bindings/python)
        working-directory: bindings/python
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            args: "--locked --release --out dist"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            args: "--locked --release --out dist"
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: ""
            args: "--locked --release --out dist --features metal"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ggml-org/llama.cpp
          ref: 0693dbfb915f33233818373b5f6969396658d02c
          path: third_party/llama.cpp

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: runner.os != 'Linux'

      - name: Build PyPI-compatible abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: dnf install -y cmake ninja-build
          args: ${{ matrix.args }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify PyPI wheel tag, metadata, and pytest suite
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip pytest twine
          python -m twine check --strict dist/*.whl
          for whl in dist/*.whl; do
            echo "Built wheel: $whl"
            case "$whl" in
              *-linux_*.whl)
                echo "ERROR: un-repaired linux_* wheel tag would be rejected by PyPI: $whl" >&2
                exit 1
                ;;
            esac
          done
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest -v

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: layerstream-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
