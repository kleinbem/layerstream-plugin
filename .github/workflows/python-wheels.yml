name: Python Wheels

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "bindings/python-cuda12/**"
      - "crates/layerstream-core/**"
      - "crates/layerstream-server/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  push:
    branches:
      - main
    paths:
      - "bindings/python/**"
      - "bindings/python-cuda12/**"
      - "crates/layerstream-core/**"
      - "crates/layerstream-server/**"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ggml-org/llama.cpp
          ref: 0693dbfb915f33233818373b5f6969396658d02c
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config binutils

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Rust format & clippy check (bindings/python)
        working-directory: bindings/python
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          cargo fmt -- --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Python static lint & type check (ruff + pyright)
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip ruff pyright pytest pytest-asyncio pytest-timeout hypothesis
          ruff check python tests scripts ../python-cuda12/python ../python-cuda12/scripts
          ruff format --check python tests scripts ../python-cuda12/python ../python-cuda12/scripts
          pyright python/layerstream tests

      - name: Smoke-test layerstream-cuda12 companion wheel packaging & metadata
        run: |
          python -m pip install --upgrade pip setuptools wheel twine
          mkdir -p bindings/python-cuda12/python/layerstream_cuda12/_backends
          gcc -shared -fPIC -Wl,-soname,libggml-cuda.so -Wl,-rpath,'$ORIGIN' \
            -o bindings/python-cuda12/python/layerstream_cuda12/_backends/libggml-cuda.so -xc /dev/null
          python bindings/python-cuda12/scripts/build_wheel.py --skip-cmake --out dist
          python -m twine check --strict bindings/python-cuda12/dist/*.whl
          python -m pip install --no-deps --force-reinstall bindings/python-cuda12/dist/*.whl
          python -c 'import os, layerstream_cuda12; assert os.path.isfile(os.path.join(layerstream_cuda12.backend_dir(), "libggml-cuda.so"))'

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Workaround: `--auditwheel skip` preserves unhashed `libggml-*.so` names for runtime
          # `dlopen` plugin loading; `audit_wheel_elf.py` enforces manylinux_2_31 ELF bounds
          # (upstream: pypa/auditwheel#594, upstream: PyO3/maturin#2045).
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            container: "2_28"
            manylinux: "2_31"
            vulkan_sdk: "/opt/vk"
            args: "--auditwheel skip --locked --release --out dist --features vulkan,dynamic-backends"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: "2_28"
            manylinux: "2_31"
            vulkan_sdk: "/opt/vk"
            args: "--auditwheel skip --locked --release --out dist --features vulkan,dynamic-backends"
          - os: macos-15
            target: aarch64-apple-darwin
            container: ""
            manylinux: ""
            vulkan_sdk: ""
            args: "--locked --release --out dist --features metal"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ggml-org/llama.cpp
          ref: 0693dbfb915f33233818373b5f6969396658d02c
          path: third_party/llama.cpp

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: runner.os != 'Linux'

      - name: Build PyPI-compatible abi3 wheel (Vulkan dynamic-backends on Linux, Metal on macOS)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          LAYERSTREAM_PORTABLE_WHEEL: "1"
          VULKAN_SDK: ${{ matrix.vulkan_sdk }}
          CMAKE_PREFIX_PATH: ${{ matrix.vulkan_sdk }}
        with:
          command: build
          working-directory: bindings/python
          container: ${{ matrix.container }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            dnf install -y bzip2
            arch=$(uname -m)
            if [ "$arch" = "aarch64" ]; then mamba_plat="linux-aarch64"; else mamba_plat="linux-64"; fi
            curl -fsSL "https://micro.mamba.pm/api/micromamba/${mamba_plat}/latest" | tar -xj -C /usr/local/bin --strip-components=1 bin/micromamba
            MAMBA_ROOT_PREFIX=/opt/mamba micromamba create -y -p /opt/vk -c conda-forge shaderc vulkan-headers vulkan-loader spirv-headers cmake ninja
            ln -sf /opt/vk/bin/glslc /opt/vk/bin/cmake /opt/vk/bin/ninja /usr/local/bin/
          args: ${{ matrix.args }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Verify PyPI wheel ELF symbols, metadata, CLI, and pytest + hypothesis suite
        working-directory: bindings/python
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo chown -R "$(id -u):$(id -g)" dist python/layerstream/_backends || true
            python scripts/audit_wheel_elf.py dist/*.whl
          fi
          python -m pip install --upgrade pip pytest pytest-asyncio pytest-timeout hypothesis twine
          python -m twine check --strict dist/*.whl
          for whl in dist/*.whl; do
            echo "Built wheel: $whl"
            case "$whl" in
              *-linux_*.whl)
                echo "ERROR: un-repaired linux_* wheel tag would be rejected by PyPI: $whl" >&2
                exit 1
                ;;
            esac
          done
          python -m pip install --force-reinstall dist/*.whl
          layerstream --version
          python -m pytest -v

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          python-version: "3.15"

      - name: Smoke-test cp314-abi3 forward compatibility on Python 3.15
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: bindings/python
        run: |
          python -m pip install --force-reinstall dist/*.whl
          layerstream --version
          python -c "import layerstream; assert layerstream.__version__ == '0.4.0'"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: layerstream-wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
