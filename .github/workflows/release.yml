name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "--features vulkan"
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: "--features vulkan"
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            features: "--features metal"
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 0693dbfb915f33233818373b5f6969396658d02c
          path: third_party/llama.cpp

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config protobuf-compiler libvulkan-dev glslc

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        env:
          LLAMA_CPP_DIR: ${{ github.workspace }}/third_party/llama.cpp
        run: |
          cargo build --locked --release -p layerstream-plugin ${{ matrix.features }}

      - name: Package Unix plugin archive
        if: matrix.archive == 'tar.gz'
        run: |
          stage="layerstream-plugin-${{ matrix.target }}"
          mkdir -p "$stage"
          cp target/release/layerstream-plugin "$stage/layerstream-plugin"
          cp plugin.toml "$stage/plugin.toml"
          cp README.md "$stage/README.md"
          cp LICENSE "$stage/LICENSE"
          cp -r licenses "$stage/licenses"
          tar czf "${stage}.tar.gz" -C "$stage" .
          sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"

      - name: Package Windows plugin archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "layerstream-plugin-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\layerstream-plugin.exe "$stage\layerstream-plugin.exe"
          Copy-Item plugin.toml "$stage\plugin.toml"
          Copy-Item README.md "$stage\README.md"
          Copy-Item LICENSE "$stage\LICENSE"
          Copy-Item -Recurse licenses "$stage\licenses"
          Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip" -Force
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "$stage.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: layerstream-plugin-${{ matrix.target }}
          path: |
            layerstream-plugin-*.tar.gz
            layerstream-plugin-*.tar.gz.sha256
            layerstream-plugin-*.zip
            layerstream-plugin-*.zip.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
