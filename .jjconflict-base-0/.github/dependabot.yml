version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/bindings/python"
      - "/bindings/node"
    schedule:
      interval: "weekly"
    groups:
      rust-deps:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/bindings/node"
    schedule:
      interval: "weekly"
    groups:
      node-deps:
        patterns:
          - "*"
