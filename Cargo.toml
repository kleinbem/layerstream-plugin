[workspace]
resolver = "2"
members = [
    "crates/layerstream-core",
    "crates/layerstream-server",
    "crates/layerstream-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/kleinbem/layerstream-plugin"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "d9c6e5a2ff3143c2c9161236bf24d415c403b9ca" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
