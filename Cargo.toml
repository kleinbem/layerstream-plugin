[workspace]
resolver = "2"
members = [
    "crates/gguf-direct-io",
    "crates/hf-gguf",
    "crates/json-schema-gbnf",
    "crates/layerstream-core",
    "crates/layerstream-ffi",
    "crates/layerstream-server",
    "crates/layerstream-plugin",
    "xtask",
]
exclude = ["bindings/python", "bindings/node"]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Size-optimize cold CLI/HTTP/TLS/MCP crates while keeping hot inference & I/O crates at opt-level = 3.
[profile.release.package.clap]
opt-level = "z"
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.axum]
opt-level = "z"
[profile.release.package.hyper]
opt-level = "z"
[profile.release.package.hyper-util]
opt-level = "z"
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.rustls]
opt-level = "z"
[profile.release.package.webpki-roots]
opt-level = "z"
[profile.release.package.rmcp]
opt-level = "z"
[profile.release.package.schemars]
opt-level = "z"
[profile.release.package.mesh-llm-plugin]
opt-level = "z"
[profile.release.package.mesh-llm-config]
opt-level = "z"
[profile.release.package.mesh-llm-types]
opt-level = "z"
[profile.release.package.toml]
opt-level = "z"
[profile.release.package.toml_edit]
opt-level = "z"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
io-uring = "0.7"
libc = "0.2"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "7c83b40b66aea027a83c4550bd5276e407816e7d" }
parking_lot = "0.13"
quick_cache = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "process"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
