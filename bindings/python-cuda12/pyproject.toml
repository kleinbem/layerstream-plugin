[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layerstream-cuda12"
version = "0.4.0"
description = "CUDA 12 dynamic ggml backend plugin for layerstream (zero-compile NVIDIA GPU support via PyPI)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    "nvidia-cuda-runtime-cu12>=12.8,<13",
    "nvidia-cublas-cu12>=12.8,<13",
]
keywords = ["llm", "gguf", "cuda", "layerstream", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/kleinbem/layerstream-plugin"
Repository = "https://github.com/kleinbem/layerstream-plugin"
Issues = "https://github.com/kleinbem/layerstream-plugin/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["layerstream_cuda12"]
include-package-data = true

[tool.setuptools.package-data]
layerstream_cuda12 = ["_backends/*.so*", "py.typed"]

[tool.ruff]
extend = "../python/pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"scripts/**" = ["S603", "S607"]
