[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "layerstream"
version = "0.4.0"
description = "Out-of-core GGUF layer-streaming LLM inference engine with O_DIRECT GPU streaming"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
keywords = [
    "llm",
    "gguf",
    "llama-cpp",
    "streaming",
    "inference",
    "out-of-core",
    "moe",
    "airllm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
cuda = [
    "layerstream-cuda12==0.4.0; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[project.scripts]
layerstream = "layerstream.__main__:main"

[project.urls]
Homepage = "https://github.com/kleinbem/layerstream-plugin"
Repository = "https://github.com/kleinbem/layerstream-plugin"
Issues = "https://github.com/kleinbem/layerstream-plugin/issues"

[tool.maturin]
python-source = "python"
module-name = "layerstream._layerstream"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["python", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S603"]
"**/scripts/**" = ["S108", "S603", "S607"]
"python/layerstream/_worker.py" = ["S603"]

[tool.pyright]
pythonVersion = "3.14"
extraPaths = ["python"]
include = ["python/layerstream", "tests"]
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
