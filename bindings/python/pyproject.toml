[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "layerstream"
version = "0.3.0"
description = "Out-of-core GGUF layer-streaming LLM inference engine with O_DIRECT GPU streaming"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = [
    "llm",
    "gguf",
    "llama-cpp",
    "streaming",
    "inference",
    "out-of-core",
    "moe",
    "airllm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/kleinbem/layerstream-plugin"
Repository = "https://github.com/kleinbem/layerstream-plugin"
Issues = "https://github.com/kleinbem/layerstream-plugin/issues"

[tool.maturin]
python-source = "python"
module-name = "layerstream._layerstream"
features = ["pyo3/extension-module"]
