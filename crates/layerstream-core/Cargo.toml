[package]
name = "layerstream-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Zero-patch llama.cpp ping-pong GPU layer streaming core with O_DIRECT GGUF reader"

[lints]
workspace = true

[features]
default = []
hf = ["dep:hf-gguf"]
vulkan = []
cuda = []
metal = []
dynamic-backends = []
python-stage-backends = []

[dependencies]
anyhow.workspace = true
getrandom.workspace = true
gguf-direct-io = { path = "../gguf-direct-io" }
hf-gguf = { path = "../hf-gguf", optional = true }
json-schema-gbnf = { path = "../json-schema-gbnf" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[build-dependencies]
cc = "1"
cmake = "0.1"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
