[package]
name = "layerstream-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Dual-mode Mesh-LLM plugin and standalone CLI for out-of-core GGUF layer streaming"

[lints]
workspace = true

[features]
default = []
vulkan = ["layerstream-core/vulkan"]
cuda = ["layerstream-core/cuda"]
metal = ["layerstream-core/metal"]
dynamic-backends = ["layerstream-core/dynamic-backends"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
layerstream-core = { path = "../layerstream-core", features = ["hf"] }
layerstream-server = { path = "../layerstream-server" }
mesh-llm-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
ureq.workspace = true
