# Supply-chain policy enforced in CI via `cargo deny --locked check`.

[advisories]
version = 2
# Fail on vulnerabilities, yanked crates, and unsoundness; only warn on transitive unmaintained crates
# (e.g. chrono pulled transitively via mesh-llm-plugin -> rmcp/schemars).
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
# Workspace path crates and pinned git dependency (`mesh-llm-plugin`) have no crates.io version.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/Mesh-LLM/mesh-llm.git"]
